{% extends 'base.html' %}

{% block title %}Удаление отзыва | Hop & Barley{% endblock %}

{% block content %}

<div class="container">


<section class="review-form-section">

    <h1>Удалить отзыв?</h1>

    <p>
        Вы уверены, что хотите удалить свой отзыв?
    </p>

    <form method="post">

        {% csrf_token %}

        <button
            type="submit"
            class="button button--primary"
        >
            Да, удалить
        </button>

    </form>

    <p>
        <a href="{% url 'products:detail' review.product.slug %}">
            Отмена
        </a>
    </p>

</section>


</div>

{% endblock %}
