services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: hop_django_luxe
      POSTGRES_USER: hop_user
      POSTGRES_PASSWORD: hop_password
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      POSTGRES_DB: hop_django_luxe
      POSTGRES_USER: hop_user
      POSTGRES_PASSWORD: hop_password
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      - db

volumes:
  pg_data: