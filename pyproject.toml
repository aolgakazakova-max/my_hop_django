# ============================================================
# НАСТРОЙКИ RUFF
# ============================================================

[tool.ruff]

# Максимальная длина строки Python-кода — 100 символов.
line-length = 100

# Проект использует Python 3.13.
target-version = "py313"

# Директории, которые Ruff не проверяет.
exclude = [
    # Виртуальное окружение проекта.
    ".venv",

    # Автоматически создаваемые Python-файлы.
    "__pycache__",

    # Служебная директория Git.
    ".git",

    # Автоматически создаваемые Django-миграции.
    "migrations",
]


# ============================================================
# ПРОВЕРКА КОДА RUFF
# ============================================================

[tool.ruff.lint]

# Группы правил, которые проверяет Ruff.
select = [
    # E — ошибки оформления и стиля кода.
    "E",

    # F — поиск программных ошибок,
    # например неиспользуемых импортов.
    "F",

    # I — проверка и сортировка импортов.
    "I",
]


# ============================================================
# ФОРМАТИРОВАНИЕ RUFF
# ============================================================

[tool.ruff.format]

# Использовать одинарные кавычки
# при форматировании Python-кода.
quote-style = "single"


# ============================================================
# НАСТРОЙКИ MYPY
# ============================================================

[tool.mypy]

# Проект использует Python 3.13.
python_version = '3.13'

# Плагин позволяет mypy понимать конструкции Django.
plugins = [
    'mypy_django_plugin.main',
]

# Не выдавать ошибки для сторонних библиотек,
# у которых отсутствует информация о типах.
ignore_missing_imports = true

# Проверять типы внутри функций
# даже без полной аннотации функции.
check_untyped_defs = true

# Не требовать аннотацию типов у каждой функции.
disallow_untyped_defs = false

# Предупреждать, если функция возвращает значение Any.
warn_return_any = true

# Предупреждать о ненужных комментариях type: ignore.
warn_unused_ignores = true

# Не проверять Django-миграции и виртуальное окружение.
exclude = [
    'migrations/',
    '.venv/',
]


# ============================================================
# НАСТРОЙКИ DJANGO-STUBS
# ============================================================

[tool.django-stubs]

# Указываем настройки Django для локальной разработки.
django_settings_module = 'config.settings.development'